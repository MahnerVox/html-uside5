<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active"><img src="element-4.svg"></a>
                <a href="#" class="menu-item"><img src="graph.svg"></a>
                <a href="#" class="menu-item"><img src="medal-star.svg"></a>
                <a href="#" class="menu-item faded"><img src="messages.svg"></a>
                <a href="#" class="menu-item faded"><img src="setting-2.svg"></a>
            </nav>
        </div>

        <div class="full">
            <div class="header">
                <div class="welcome">
                    <h1>Welcome, Amanda</h1>
                    <p>Tue, 07 June 2022</p>
                </div>  
                <div class="header-right">
                    <div class="search">
                        <img src="search-normal.svg" alt="search icon">Search
                    </div>
                    <div class="bell"><img src="Group 77.svg" alt="notifications"></div>
                    <div class="logo"><img src="Rectangle 1072.svg" alt="profile logo"></div>
                </div>
            </div>
            <section class="main">
                <div class="rectangle"><img src="Rectangle 6691.svg" alt="banner"></div>
                <div class="info">
                    <div class="profile">
                        <div class="image1">
                            <img src="Ellipse 11.svg" alt="user avatar">
                            <div class="image1info">
                                Alexa Rawles
                                <p>alexarawles@gmail.com</p>
                            </div>    
                        </div>
                        <div class="bluebutton">Edit</div>
                    </div>

                    <form class="form">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="Your First Name">
                        </div>
                        <div class="form-group">
                            <label>Nick name</label>
                            <input type="text" placeholder="Your Nick Name">
                        </div>

                        <div class="form-group">
                            <label>Gender</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected>Your Gender</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Country</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected>Your Country</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Language</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected>Your Language</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Time Zone</label>
                            <div class="select-wrapper">
                                <select>
                                    <option value="" disabled selected>Your Time Zone</option>
                                </select>
                            </div>
                        </div>
                    </form>

                    <div class="email">
                        <h3>My email address</h3>
                        <div class="email-item">
                            <div class="email-icon"><img src="sms.svg" alt="email icon"></div>
                            <div class="email-details">
                                alexarawles@gmail.com
                                <p>1 month ago</p>
                            </div>
                        </div>
                        <div class="add-email">
                            <p>+Add Email Address</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
